
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>실시간 메시지</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap');

:root {
  color-scheme: dark;
  font-family: 'Noto Sans KR', sans-serif;
  background: #08080b;
  color: #f7f7fb;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #08080b;
}

button, input, textarea { font: inherit; }
.hidden { display: none !important; }

.app {
  width: min(720px, calc(100% - 32px));
  margin: auto;
  padding: 32px 0;
}

h1 {
  font-size: clamp(2rem, 6vw, 3rem);
  margin: 8px 0;
}

h2 { font-size: 1.15rem; }

.muted {
  color: #a2a2af;
  line-height: 1.6;
}

.eyebrow {
  color: #b5a4ff;
  letter-spacing: .2em;
  font-weight: 800;
  font-size: .76rem;
}

.panel {
  padding: 24px;
  margin: 16px 0;
  background: #15151c;
  border: 1px solid #2a2a35;
  border-radius: 18px;
}

label.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 16px 0;
  font-weight: 600;
}

input[type=text], textarea {
  width: 100%;
  border: 1px solid #383844;
  border-radius: 12px;
  padding: 13px;
  background: #0d0d12;
  color: white;
}

textarea {
  resize: vertical;
  min-height: 120px;
}

.identity {
  border: 0;
  padding: 0;
  margin: 0 0 18px;
  display: flex;
  gap: 22px;
}

.identity legend {
  font-weight: 700;
  margin-bottom: 12px;
}

.identity input { accent-color: #a795ff; }

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  background: #a795ff;
  color: #171321;
  font-weight: 800;
  cursor: pointer;
}

button:disabled { opacity: .6; }

.status {
  min-height: 1.4em;
  color: #c1b4ff;
  font-size: .9rem;
}

#qrcode {
  width: 206px;
  min-height: 206px;
  background: white;
  border-radius: 12px;
  padding: 8px;
  display: grid;
  place-items: center;
  margin: 18px 0;
}

#qrcode img, #qrcode canvas {
  max-width: 190px;
  max-height: 190px;
}

.link {
  color: #c2b5ff;
  overflow-wrap: anywhere;
  font-size: .85rem;
}

/* ===================================
   티비플 스타일 실시간 자막 화면
   =================================== */

.stage {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #08080b;
  isolation: isolate;
}

/* 자막이 지나가는 전체 영역 */
#wall {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

/* 각각의 날아가는 자막 */
.danmaku {
  position: absolute;
  left: 0;
  top: 0;

  display: block;
  width: max-content;
  max-width: none;

  white-space: pre;
  word-break: keep-all;

  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 900;
  line-height: 1.25;
  letter-spacing: -.045em;

  color: white;
  -webkit-text-stroke: .6px rgba(0, 0, 0, .9);
  paint-order: stroke fill;
  text-shadow:
    2px 2px 2px #000,
    -2px -2px 2px #000,
    2px -2px 2px #000,
    -2px 2px 2px #000,
    0 0 8px rgba(0, 0, 0, .8);

  user-select: none;
  will-change: transform;
}

/* 일부 메시지는 살짝 기울어진 느낌 */
.danmaku.tilt {
  transform-origin: center;
}

/* 화면 모서리에 표시되는 연결 오류 */
.error {
  position: fixed;
  z-index: 9999;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90vw;
  text-align: center;
  color: #bbb;
  font-size: 1.15rem;
  line-height: 1.7;
  pointer-events: none;
}

@media (max-width: 560px) {
  .app { padding: 20px 0; }
  .panel { padding: 18px; }
}
</style>
</head>

<body>

<!-- 메시지 전송 화면 -->
<main id="sender" class="app">

  <header>
    <div class="eyebrow">LIVE MESSAGE</div>
    <h1>마음을 전해보세요</h1>
    <p class="muted">
      닉네임 또는 익명으로 메시지를 보낼 수 있어요.
    </p>
  </header>

  <section class="panel">
    <h2>메시지 화면 QR 코드</h2>
    <p class="muted">
      QR 코드를 공유하면 누구나 메시지를 보낼 수 있습니다.
    </p>

    <div id="qrcode"></div>

    <p>
      <a id="displayLink" class="link"
         target="_blank" rel="noopener">
        표시 화면 열기
      </a>
    </p>
  </section>

  <section class="panel">
    <h2>메시지 보내기</h2>

    <form id="form">

      <fieldset class="identity">
        <legend>어떤 이름으로 보낼까요?</legend>

        <label>
          <input type="radio" name="identity"
                 value="anonymous" checked>
          익명
        </label>

        <label>
          <input type="radio" name="identity"
                 value="nickname">
          닉네임
        </label>
      </fieldset>

      <label id="nicknameField" class="field hidden">
        닉네임
        <input id="nickname" type="text"
               maxlength="24" placeholder="닉네임 입력">
      </label>

      <label class="field">
        메시지
        <textarea id="message" maxlength="240"
          required placeholder="전하고 싶은 말을 입력하세요."></textarea>

        <span class="muted" style="font-size:.82rem">
          최대 240자
        </span>
      </label>

      <button id="send" type="submit">
        메시지 보내기
      </button>

      <p id="status" class="status" role="status"></p>
    </form>
  </section>

  <p class="muted" style="font-size:.82rem">
    표시 화면에는 메시지 내용만 나타납니다.
  </p>
</main>

<!-- 티비플 스타일 자막 표시 화면 -->
<main id="display" class="stage hidden" aria-live="off">
  <div id="wall"></div>
</main>

<div id="error" class="error hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  serverTimestamp,
  get,
  query,
  orderByChild,
  limitToLast,
  onChildAdded
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

/* Firebase 설정 */
const firebaseConfig = {
  apiKey: "AIzaSyA2sTHW22VtoAIXd2P8b9Nift0c-WPSLdM",
  authDomain: "rolling-7519c.firebaseapp.com",
  databaseURL: "https://rolling-7519c-default-rtdb.firebaseio.com",
  projectId: "rolling-7519c",
  storageBucket: "rolling-7519c.firebasestorage.app",
  messagingSenderId: "663780806800",
  appId: "1:663780806800:web:f6f6f850fd926eeb42c815"
};

const $ = selector => document.querySelector(selector);

const params = new URLSearchParams(location.search);
const isDisplay = params.get("display") === "1";
const room = params.get("room") || "main";

const configured =
  firebaseConfig.apiKey &&
  firebaseConfig.databaseURL &&
  firebaseConfig.projectId;

if (isDisplay) {
  $("#sender").classList.add("hidden");
  $("#display").classList.remove("hidden");
  document.title = "실시간 메시지 화면";
} else {
  const displayURL = new URL(location.href);
  displayURL.searchParams.set("display", "1");
  displayURL.searchParams.set("room", room);

  $("#displayLink").href = displayURL.href;
  $("#displayLink").textContent = displayURL.href;

  if (window.QRCode) {
    new QRCode($("#qrcode"), {
      text: displayURL.href,
      width: 190,
      height: 190,
      colorDark: "#111111",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  }
}

if (!configured) {
  $("#error").textContent = "Firebase 설정을 확인해 주세요.";
  $("#error").classList.remove("hidden");

  if (!isDisplay) {
    $("#status").textContent = "Firebase 설정이 필요합니다.";
  }
} else {

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  /* ===================================
     메시지 전송
     =================================== */

  if (!isDisplay) {
    const form = $("#form");
    const nick = $("#nickname");
    const msg = $("#message");
    const status = $("#status");
    const send = $("#send");

    document.querySelectorAll('[name="identity"]')
      .forEach(radio => {
        radio.addEventListener("change", () => {
          const useNickname =
            $('[name="identity"]:checked').value === "nickname";

          $("#nicknameField").classList.toggle(
            "hidden", !useNickname
          );

          nick.required = useNickname;
        });
      });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const text = msg.value.trim();

      const useNickname =
        $('[name="identity"]:checked').value === "nickname";

      const name = nick.value.trim();

      if (!text) {
        status.textContent = "메시지를 입력해 주세요.";
        return;
      }

      if (useNickname && !name) {
        status.textContent =
          "닉네임을 입력하거나 익명을 선택해 주세요.";
        return;
      }

      send.disabled = true;
      status.textContent = "전송 중...";

      try {
        await set(
          push(ref(db, `rooms/${room}/messages`)),
          {
            text: text.slice(0, 240),
            nickname: useNickname ? name.slice(0, 24) : "",
            anonymous: !useNickname,
            createdAt: serverTimestamp()
          }
        );

        msg.value = "";
        status.textContent = "메시지를 보냈어요!";
      } catch (error) {
        console.error(error);

        status.textContent =
          "전송 실패. Firebase 연결과 Database 규칙을 확인해 주세요.";
      } finally {
        send.disabled = false;
      }
    });

  } else {

    /* ===================================
       티비플 스타일 실시간 자막
       =================================== */

    const wall = $("#wall");
    const messagesRef = ref(db, `rooms/${room}/messages`);

    const seen = new Set();

    // 여러 색상을 무작위로 사용
    const colors = [
      "#ffffff",
      "#ffe66d",
      "#ff9ed2",
      "#8be9fd",
      "#a6ff9e",
      "#ffaaa5",
      "#c9a7ff",
      "#ffbd69",
      "#f5f5f5",
      "#7dffdc",
      "#ff7777",
      "#b6c7ff"
    ];

    // 동시에 너무 많은 요소가 쌓이는 것을 방지
    const MAX_DANMAKU = 180;

    // 메시지 크기 및 속도 조절
    const MIN_FONT = 22;
    const MAX_FONT = 58;

    const MIN_DURATION = 6500;
    const MAX_DURATION = 14500;

    // 최근 사용한 위치를 기록해 겹침을 조금 줄임
    const laneLastUsed = new Map();
    const LANE_HEIGHT = 66;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function pickColor() {
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function chooseLane() {
      const height = window.innerHeight;
      const laneCount = Math.max(
        1,
        Math.floor(height / LANE_HEIGHT)
      );

      const now = performance.now();
      const available = [];

      for (let i = 0; i < laneCount; i++) {
        const lastUsed = laneLastUsed.get(i) || 0;

        if (now - lastUsed > 650) {
          available.push(i);
        }
      }

      let lane;

      if (available.length) {
        lane = available[
          Math.floor(Math.random() * available.length)
        ];
      } else {
        // 모든 줄이 사용 중이면 무작위 줄 선택
        lane = Math.floor(Math.random() * laneCount);
      }

      laneLastUsed.set(lane, now);

      const top = lane * LANE_HEIGHT +
        random(0, Math.max(0, LANE_HEIGHT - 35));

      return Math.min(
        Math.max(0, top),
        Math.max(0, height - 40)
      );
    }

    function showDanmaku(data) {
      const text = String(data.text || "").trim();

      if (!text) return;

      // 요소가 너무 많아지면 가장 오래된 자막부터 정리
      while (wall.childElementCount >= MAX_DANMAKU) {
        wall.firstElementChild?.remove();
      }

      const element = document.createElement("div");
      element.className = "danmaku";

      // 사용자 메시지는 HTML이 아니라 일반 텍스트로 표시
      element.textContent = text;

      const fontSize = Math.round(
        random(MIN_FONT, MAX_FONT)
      );

      element.style.fontSize = `${fontSize}px`;
      element.style.color = pickColor();

      // 가끔 살짝 기울어진 자막
      if (Math.random() < 0.24) {
        element.classList.add("tilt");
        element.style.rotate =
          `${random(-5, 5).toFixed(1)}deg`;
      }

      // 화면 위부터 아래까지 다양한 높이에 배치
      element.style.top = `${chooseLane()}px`;

      wall.appendChild(element);

      // 실제 글자 너비 측정
      const width = element.getBoundingClientRect().width;

      // 화면 오른쪽 바깥에서 시작해서
      // 글자가 완전히 왼쪽으로 빠져나갈 때까지 이동
      const duration = random(
        MIN_DURATION,
        MAX_DURATION
      );

      // 자막마다 시작과 끝 위치를 개별 계산
      const animation = element.animate(
        [
          {
            transform: `translateX(${window.innerWidth}px)`
          },
          {
            transform: `translateX(${-width - 20}px)`
          }
        ],
        {
          duration,
          easing: "linear",
          fill: "forwards"
        }
      );

      animation.onfinish = () => {
        element.remove();
      };
    }

    // 접속 이전에 존재하던 메시지는 지나간 자막으로 처리하지 않음
    // 접속 이후 들어오는 새 메시지만 화면에 표시
    async function startDanmaku() {
      try {
        const initial = await get(messagesRef);

        initial.forEach(child => {
          seen.add(child.key);
        });

        onChildAdded(
          query(
            messagesRef,
            orderByChild("createdAt"),
            limitToLast(300)
          ),
          snapshot => {
            if (seen.has(snapshot.key)) return;

            seen.add(snapshot.key);

            showDanmaku(snapshot.val() || {});
          },
          error => {
            console.error(error);

            $("#error").textContent =
              "실시간 메시지를 불러오지 못했습니다. Firebase 규칙을 확인해 주세요.";

            $("#error").classList.remove("hidden");
          }
        );

      } catch (error) {
        console.error(error);

        $("#error").textContent =
          "메시지를 불러오지 못했습니다. Firebase 연결 및 보안 규칙을 확인해 주세요.";

        $("#error").classList.remove("hidden");
      }
    }

    startDanmaku();
  }
}
</script>
</body>
</html>
