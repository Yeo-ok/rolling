<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실시간 메시지</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap');
:root{color-scheme:dark;font-family:'Noto Sans KR',sans-serif;background:#08080b;color:#f7f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08080b}button,input,textarea{font:inherit}.hidden{display:none!important}.app{width:min(720px,calc(100% - 32px));margin:auto;padding:32px 0}h1{font-size:clamp(2rem,6vw,3rem);margin:8px 0}h2{font-size:1.15rem}.muted{color:#a2a2af;line-height:1.6}.eyebrow{color:#b5a4ff;letter-spacing:.2em;font-weight:800;font-size:.76rem}.panel{padding:24px;margin:16px 0;background:#15151c;border:1px solid #2a2a35;border-radius:18px}label.field{display:flex;flex-direction:column;gap:8px;margin:16px 0;font-weight:600}input[type=text],textarea{width:100%;border:1px solid #383844;border-radius:12px;padding:13px;background:#0d0d12;color:white}textarea{resize:vertical;min-height:120px}.identity{border:0;padding:0;margin:0 0 18px;display:flex;gap:22px}.identity legend{font-weight:700;margin-bottom:12px}.identity input{accent-color:#a795ff}button{width:100%;border:0;border-radius:12px;padding:14px;background:#a795ff;color:#171321;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.status{min-height:1.4em;color:#c1b4ff;font-size:.9rem}#qrcode{width:206px;min-height:206px;background:white;border-radius:12px;padding:8px;display:grid;place-items:center;margin:18px 0}#qrcode img,#qrcode canvas{max-width:190px;max-height:190px}.link{color:#c2b5ff;overflow-wrap:anywhere;font-size:.85rem}.stage{height:100vh;width:100vw;position:relative;display:grid;place-items:center;overflow:hidden;padding:6vw}.message{white-space:pre-wrap;overflow-wrap:anywhere;text-align:center}.current{max-width:92vw;max-height:84vh;font-size:clamp(2.3rem,8vw,8.5rem);line-height:1.18;font-weight:800;letter-spacing:-.035em;opacity:0;transform:scale(.82)}.current.enter{animation:enter .55s cubic-bezier(.18,.8,.2,1) forwards}.current.exit{animation:exit .45s ease forwards}.waiting{position:absolute;right:3.5vw;bottom:3.5vh;width:min(30vw,520px);max-height:24vh;overflow:hidden;font-size:clamp(1rem,2.1vw,2.2rem);line-height:1.25;font-weight:700;text-align:right;color:#b1b1bd;opacity:0;transform:scale(.82);transform-origin:bottom right}.waiting.visible{animation:waitin .3s ease forwards}.error{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:90vw;text-align:center;color:#bbb;font-size:1.15rem;line-height:1.7}@keyframes enter{from{opacity:0;transform:scale(.82);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}@keyframes exit{to{opacity:0;transform:scale(1.14);filter:blur(6px)}}@keyframes waitin{to{opacity:.75;transform:scale(1)}}@media(max-width:560px){.panel{padding:18px}.stage{padding:8vw}.current{font-size:clamp(2rem,10vw,4rem)}.waiting{width:46vw;right:5vw;bottom:4vh;font-size:clamp(.95rem,3.5vw,1.4rem)}}
</style></head><body>
<main id="sender" class="app"><header><div class="eyebrow">LIVE MESSAGE</div><h1>마음을 전해보세요</h1><p class="muted">닉네임 또는 익명으로 메시지를 보낼 수 있어요.</p></header>
<section class="panel"><h2>메시지 화면 QR 코드</h2><p class="muted">QR 코드를 공유하면 누구나 메시지를 보낼 수 있습니다.</p><div id="qrcode"></div><p><a id="displayLink" class="link" target="_blank" rel="noopener">표시 화면 열기</a></p></section>
<section class="panel"><h2>메시지 보내기</h2><form id="form"><fieldset class="identity"><legend>어떤 이름으로 보낼까요?</legend><label><input type="radio" name="identity" value="anonymous" checked> 익명</label><label><input type="radio" name="identity" value="nickname"> 닉네임</label></fieldset>
<label id="nicknameField" class="field hidden">닉네임<input id="nickname" type="text" maxlength="24" placeholder="닉네임 입력"></label><label class="field">메시지<textarea id="message" maxlength="240" required placeholder="전하고 싶은 말을 입력하세요."></textarea><span class="muted" style="font-size:.82rem">최대 240자</span></label><button id="send" type="submit">메시지 보내기</button><p id="status" class="status" role="status"></p></form></section><p class="muted" style="font-size:.82rem">표시 화면에는 메시지 내용만 나타납니다.</p></main>
<main id="display" class="stage hidden" aria-live="polite"><div id="current" class="message current"></div><div id="waiting" class="message waiting"></div></main><div id="error" class="error hidden"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getDatabase,ref,push,set,serverTimestamp,get,query,orderByChild,limitToLast,onChildAdded}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
// Firebase Console > 프로젝트 설정 > 웹 앱에서 config 값을 아래에 입력하세요.
const firebaseConfig={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",projectId:"YOUR_PROJECT",storageBucket:"YOUR_PROJECT.firebasestorage.app",messagingSenderId:"YOUR_MESSAGING_SENDER_ID",appId:"YOUR_APP_ID"};
const configured=firebaseConfig.apiKey!=="YOUR_API_KEY"&&firebaseConfig.databaseURL&&!firebaseConfig.databaseURL.includes("YOUR_PROJECT");
const $=s=>document.querySelector(s),isDisplay=new URLSearchParams(location.search).get("display")==="1",room=new URLSearchParams(location.search).get("room")||"main";
if(isDisplay){$("#sender").classList.add("hidden");$("#display").classList.remove("hidden");document.title="실시간 메시지 화면"}else{const u=new URL(location.href);u.searchParams.set("display","1");u.searchParams.set("room",room);$("#displayLink").href=u.href;$("#displayLink").textContent=u.href;if(window.QRCode)new QRCode($("#qrcode"),{text:location.href.split("#")[0],width:190,height:190,colorDark:"#111",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.M})}
if(!configured){$("#error").textContent="Firebase 설정을 완료하면 실시간 메시지가 작동합니다. 이 HTML 안의 firebaseConfig 값을 입력하세요.";$("#error").classList.remove("hidden");if(!isDisplay)$("#status").textContent="Firebase 설정이 필요합니다. HTML 안의 firebaseConfig를 입력해 주세요."}
else{const db=getDatabase(initializeApp(firebaseConfig));
if(!isDisplay){const form=$("#form"),nick=$("#nickname"),msg=$("#message"),status=$("#status"),send=$("#send");document.querySelectorAll('[name="identity"]').forEach(r=>r.addEventListener("change",()=>{const use=$('[name="identity"]:checked').value==="nickname";$("#nicknameField").classList.toggle("hidden",!use);nick.required=use}));
form.addEventListener("submit",async e=>{e.preventDefault();const text=msg.value.trim(),use=$('[name="identity"]:checked').value==="nickname",name=nick.value.trim();if(!text)return status.textContent="메시지를 입력해 주세요.";if(use&&!name)return status.textContent="닉네임을 입력하거나 익명을 선택해 주세요.";send.disabled=true;status.textContent="전송 중...";try{await set(push(ref(db,`rooms/${room}/messages`)),{text:text.slice(0,240),nickname:use?name.slice(0,24):"",anonymous:!use,createdAt:serverTimestamp()});msg.value="";status.textContent="메시지를 보냈어요!"}catch(e){console.error(e);status.textContent="전송 실패. Firebase Database 규칙을 확인해 주세요."}finally{send.disabled=false}})}
else{const current=$("#current"),waiting=$("#waiting"),messages=ref(db,`rooms/${room}/messages`),seen=new Set(),queue=[];let playing=false;
try{const initial=await get(messages);initial.forEach(c=>seen.add(c.key));onChildAdded(query(messages,orderByChild("createdAt"),limitToLast(300)),snap=>{if(seen.has(snap.key))return;seen.add(snap.key);queue.push({id:snap.key,...snap.val()});queue.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));updateWaiting();playNext()})}catch(e){console.error(e);$("#error").textContent="메시지를 불러오지 못했습니다. Firebase 규칙을 확인해 주세요.";$("#error").classList.remove("hidden")}
function updateWaiting(){if(playing&&queue.length){waiting.textContent=queue[0].text||"";waiting.classList.remove("visible");void waiting.offsetWidth;waiting.classList.add("visible")}else{waiting.textContent="";waiting.classList.remove("visible")}}
function playNext(){if(playing||!queue.length)return;playing=true;const item=queue.shift();current.textContent=item.text||"";current.classList.remove("enter","exit");void current.offsetWidth;current.classList.add("enter");updateWaiting();setTimeout(()=>{current.classList.remove("enter");current.classList.add("exit");setTimeout(()=>{current.textContent="";current.classList.remove("exit");playing=false;updateWaiting();playNext()},450)},5000)}
}}
</script></body></html>
